<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173d29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ForraGO">
<link rel="manifest" href="manifest.json">

<title>ForraGO | Inteligencia Forrajera</title>

<link rel="icon" type="image/png" sizes="32x32" href="img/img_01.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/img_02.png">

<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="forced-color-adjust" content="none">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
    color-scheme:light only;
    --hero-foto:url(img/img_03.jpg);
    --verde:#173d29;
    --verde2:#285d3d;
    --verde3:#5d9467;
    --lima:#cbdc78;
    --crema:#f5f3eb;
    --blanco:#ffffff;
    --texto:#172019;
    --gris:#7c857e;
    --borde:#e3e7df;
    --sombra:0 18px 55px rgba(23,61,41,.10);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    overflow-x:hidden;
}

body{
    margin:0;
    background:
        linear-gradient(rgba(245,243,235,.84), rgba(245,243,235,.84)),
        url("img/img_13.jpg") center center / cover fixed no-repeat;
    color:var(--texto);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    overflow-x:hidden;
}

.splash{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--crema);
    transition:opacity .5s ease, visibility .5s ease;
}

.splash.oculto{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.splash-logo{
    width:180px;
    height:auto;
    animation:splash-pulso 1.6s ease-in-out infinite;
}

@keyframes splash-pulso{
    0%,100%{
        transform:scale(1);
        opacity:1;
    }
    50%{
        transform:scale(1.05);
        opacity:.85;
    }
}

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}


/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 5px 22px;
}

.header-centrado{
    justify-content:center;
}

.logo-principal{
    height:150px;
    width:auto;
    max-width:100%;
}

@media(max-width:750px){

    .logo-principal{
        height:110px;
    }

}


/* =========================
   HERO
========================= */

.hero{
    position:relative;
    min-height:420px;
    overflow:hidden;
    border-radius:34px;
    background-image:var(--hero-foto);
    background-size:cover;
    background-position:center;
    box-shadow:0 30px 75px rgba(23,61,41,.22);
}

.campo{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.campo::before{
    content:"";
    position:absolute;
    width:1000px;
    height:450px;
    right:-250px;
    bottom:-260px;
    border-radius:50%;
    background:
        repeating-linear-gradient(
            7deg,
            rgba(203,220,120,.55) 0px,
            rgba(203,220,120,.55) 2px,
            transparent 2px,
            transparent 12px
        );
    transform:rotate(-5deg);
}

.campo::after{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    right:-180px;
    top:-350px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(203,220,120,.35),transparent 65%);
}

.hero-contenido{
    position:relative;
    z-index:2;
    padding:48px 45px;
}

.pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 13px;
    border-radius:50px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.14);
    color:white;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.2px;
}

.punto{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--lima);
}

.hero h1{
    max-width:610px;
    margin:26px 0 0;
    color:white;
    font-size:clamp(52px,8vw,86px);
    line-height:.91;
    letter-spacing:-5px;
    font-weight:900;
}

.hero-palabra{
    display:inline-block;
    opacity:0;
    transform:translateY(18px);
    transition:opacity .6s ease, transform .6s ease;
}

.hero-palabra.mostrar{
    opacity:1;
    transform:translateY(0);
}

.hero-palabra-lima{
    color:var(--lima);
}

.hero p{
    max-width:470px;
    margin:24px 0 0;
    color:rgba(255,255,255,.70);
    font-size:14px;
    line-height:1.7;
}

.hero-btn{
    display:inline-flex;
    align-items:center;
    gap:12px;
    margin-top:28px;
    padding:15px 20px;
    border-radius:15px;
    background:white;
    color:var(--verde);
    text-decoration:none;
    font-size:10px;
    font-weight:900;
    letter-spacing:.8px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
}


/* =========================
   SECCIONES
========================= */

.seccion{
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin:34px 5px 14px;
}

.seccion h2{
    margin:0;
    font-size:22px;
    letter-spacing:-.8px;
}

.seccion p{
    margin:5px 0 0;
    color:var(--gris);
    font-size:11px;
}

.numero{
    color:#a3aaa4;
    font-size:10px;
    font-weight:900;
}

.seccion-simple{
    justify-content:center;
    text-align:center;
    margin:38px 5px 18px;
}

.seccion-simple h2{
    font-size:20px;
}


/* =========================
   PESTAÑAS TIPO DE EVALUACIÓN
========================= */

.tipo-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:26px;
}

.tipo-tab{
    display:flex;
    align-items:center;
    gap:14px;
    padding:22px 18px;
    border-radius:22px;
    border:2px solid var(--borde);
    background:white;
    color:var(--gris);
    font-family:inherit;
    cursor:pointer;
    text-align:left;
    box-shadow:var(--sombra);
    transition:border-color .2s ease, background .2s ease, transform .2s ease;
}

.tipo-tab:hover{
    transform:translateY(-2px);
}

.tipo-tab:active{
    transform:translateY(0) scale(.98);
}

.tipo-tab-emoji{
    font-size:30px;
    flex-shrink:0;
}

.tipo-tab-texto{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.tipo-tab-texto strong{
    font-size:15px;
    font-weight:900;
    color:var(--verde);
    letter-spacing:-.3px;
}

.tipo-tab-texto span{
    font-size:10.5px;
    color:var(--gris);
    font-weight:700;
}

.tipo-tab.activo{
    border-color:var(--verde);
    background:var(--verde);
}

.tipo-tab.activo .tipo-tab-texto strong{
    color:white;
}

.tipo-tab.activo .tipo-tab-texto span{
    color:rgba(255,255,255,.75);
}

@media(max-width:560px){

    .tipo-tabs{
        grid-template-columns:1fr;
    }

}


/* =========================================================
   MIS LOTES
========================================================= */

.lotes-banner{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
    padding:16px 18px;
    border-radius:16px;
    background:white;
    border:1.5px solid var(--borde);
    box-shadow:var(--sombra);
    cursor:pointer;
    transition:transform .2s ease, border-color .2s ease;
}

.lotes-banner:hover{
    transform:translateY(-2px);
    border-color:var(--verde3);
}

.lotes-banner:active{
    transform:translateY(0) scale(.98);
}

.lotes-banner-icono{
    font-size:26px;
    flex-shrink:0;
}

.lotes-banner-texto{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.lotes-banner-texto strong{
    color:var(--verde);
    font-size:15px;
    font-weight:900;
    letter-spacing:-.3px;
}

.lotes-banner-texto span{
    color:var(--gris);
    font-size:10.5px;
    font-weight:700;
}

.lotes-banner-flecha{
    color:var(--verde3);
    font-size:18px;
    flex-shrink:0;
}

.lotes-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
}

.lotes-header h2{
    margin:0;
    font-size:22px;
    letter-spacing:-.6px;
}

.lotes-volver{
    padding:9px 14px;
    border-radius:11px;
    border:1px solid var(--borde);
    background:white;
    color:var(--verde);
    font-family:inherit;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.lotes-nuevo-btn{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:2px dashed var(--verde3);
    background:#f4f7ec;
    color:var(--verde);
    font-family:inherit;
    font-size:11px;
    font-weight:900;
    letter-spacing:.5px;
    cursor:pointer;
    margin-bottom:18px;
}

.lote-campo{
    margin-bottom:16px;
}

.lote-campo .label{
    margin-bottom:8px;
}

.lote-campo input,
.lote-campo select{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:2px solid var(--borde);
    font-size:13px;
    font-family:inherit;
    color:var(--texto);
    background:#fafbf8;
    box-sizing:border-box;
    height:46px;
}

.lote-campo textarea{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:2px solid var(--borde);
    font-size:13px;
    line-height:1.5;
    font-family:inherit;
    color:var(--texto);
    background:#fafbf8;
    resize:vertical;
    box-sizing:border-box;
}

.lote-campo input:focus,
.lote-campo select:focus,
.lote-campo textarea:focus{
    outline:none;
    border-color:var(--verde3);
}

.lote-campo select{
    cursor:pointer;
}

.lote-card{
    padding:18px;
    border-radius:18px;
    background:white;
    border:1px solid var(--borde);
    box-shadow:var(--sombra);
    margin-bottom:14px;
}

.lote-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.lote-card-nombre{
    font-size:15px;
    font-weight:900;
    color:var(--verde);
    letter-spacing:-.3px;
}

.lote-card-sub{
    margin-top:3px;
    font-size:10.5px;
    color:var(--gris);
    font-weight:700;
}

.lote-card-badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:9px;
    font-weight:900;
    white-space:nowrap;
}

.lote-card-datos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--borde);
}

.lote-card-dato span{
    display:block;
    font-size:9px;
    color:var(--gris);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
}

.lote-card-dato strong{
    display:block;
    margin-top:2px;
    font-size:12px;
    color:var(--texto);
}

.lote-card-botones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.lote-card-trabajar{
    grid-column:1 / -1;
    padding:13px;
    border:0;
    border-radius:13px;
    background:var(--verde);
    color:white;
    font-family:inherit;
    font-size:10px;
    font-weight:900;
    letter-spacing:.5px;
    cursor:pointer;
}

.lote-card-mini-btn{
    padding:10px;
    border-radius:11px;
    border:1px solid var(--borde);
    background:white;
    color:#58635b;
    font-family:inherit;
    font-size:9px;
    font-weight:900;
    cursor:pointer;
}

.lote-vacio{
    text-align:center;
    padding:40px 20px;
    color:var(--gris);
    font-size:12px;
    line-height:1.7;
}

.lote-activo-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
    padding:13px 16px;
    border-radius:14px;
    background:#f4f7ec;
    border:1.5px solid var(--lima);
    font-size:11px;
    font-weight:800;
    color:var(--verde);
}

.lote-activo-banner a{
    color:var(--verde3);
    text-decoration:underline;
    cursor:pointer;
    flex-shrink:0;
}

.ficha-lote-titulo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.ficha-lote-titulo h3{
    margin:0;
    font-size:19px;
    letter-spacing:-.4px;
    color:var(--verde);
}

.ficha-stat-caja{
    padding:20px;
    border-radius:18px;
    background:linear-gradient(135deg,var(--verde),var(--verde2));
    color:white;
    text-align:center;
    margin-bottom:12px;
}

.ficha-stat-caja .numero-grande{
    font-size:28px;
    font-weight:900;
    letter-spacing:-1px;
    display:block;
}

.ficha-stat-caja .etiqueta{
    font-size:10px;
    font-weight:800;
    letter-spacing:.5px;
    opacity:.8;
    display:block;
    margin-top:2px;
}

.ficha-stats-fila{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
}

.ficha-stats-fila .lote-card{
    margin-bottom:0;
    padding:14px;
    text-align:center;
}

.ficha-stats-fila .lote-card strong{
    display:block;
    font-size:16px;
    color:var(--verde);
    margin-top:4px;
}

.ficha-stats-fila .lote-card span{
    font-size:9px;
    color:var(--gris);
    font-weight:700;
    text-transform:uppercase;
}

.ficha-botones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:6px;
}

.historial-tabla{
    width:100%;
    border-collapse:collapse;
    margin-top:14px;
    font-size:11px;
}

.historial-tabla th{
    text-align:left;
    padding:9px 8px;
    color:var(--gris);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.4px;
    border-bottom:2px solid var(--borde);
}

.historial-tabla td{
    padding:11px 8px;
    border-bottom:1px solid var(--borde);
}

.historial-borrar{
    border:0;
    background:transparent;
    font-size:13px;
    cursor:pointer;
    padding:4px;
    opacity:.6;
}

.historial-borrar:hover{
    opacity:1;
}

.historial-grafico{
    margin-top:18px;
    padding:16px;
    border-radius:16px;
    background:white;
    border:1px solid var(--borde);
}

.informe-lote-print{
    display:none;
}

@media print{

    body.imprimiendo-lote #vistaCalculadora,
    body.imprimiendo-lote #vistaLotes,
    body.imprimiendo-lote .lotes-banner,
    body.imprimiendo-lote .lote-activo-banner{
        display:none!important;
    }

    body.imprimiendo-lote .informe-lote-print{
        display:block!important;
    }

}


.sello-credibilidad{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin:-14px 5px 28px;
    color:var(--gris);
    font-size:10px;
    font-weight:700;
    text-align:center;
}

.sello-credibilidad span{
    display:flex;
    align-items:center;
    justify-content:center;
    width:15px;
    height:15px;
    border-radius:50%;
    background:var(--lima);
    color:var(--verde);
    font-size:9px;
    font-weight:900;
    flex-shrink:0;
}


/* =========================
   PANEL
========================= */

.panel{
    padding:25px;
    border-radius:28px;
    background:white;
    border:1px solid var(--borde);
    box-shadow:var(--sombra);
}

.label{
    display:block;
    margin-bottom:10px;
    color:#7c857d;
    font-size:9px;
    font-weight:900;
    letter-spacing:1.1px;
    text-transform:uppercase;
}

.label-espaciado{
    margin-top:24px;
}


/* =========================================================
   TARJETAS DE CULTIVOS
========================================================= */

.cultivos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.cultivos-scroll{
    grid-template-columns:unset;
    grid-auto-flow:column;
    grid-template-rows:repeat(2,190px);
    grid-auto-columns:calc((100% - 28px)/3.18);
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:2px;
}

.cultivos-scroll::-webkit-scrollbar{
    display:none;
}

.cultivos-scroll .cultivo{
    scroll-snap-align:start;
}

.cultivos-hint{
    margin:10px 0 0;
    text-align:center;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.3px;
    color:var(--gris);
}

.cultivos-dots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:9px;
}

.cultivos-dot{
    border:0;
    padding:0;
    appearance:none;
    cursor:pointer;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--borde);
    transition:background .25s ease, transform .25s ease, width .25s ease;
}

.cultivos-dot.activo{
    background:var(--verde2);
    width:16px;
    border-radius:4px;
}

.sinfoto-bg{
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--verde2),var(--verde));
    color:rgba(203,220,120,.5);
    font-weight:900;
    font-size:64px;
}

.cultivo{
    position:relative;
    height:190px;
    overflow:hidden;
    border-radius:22px;
    cursor:pointer;
    border:2px solid transparent;
    background:#dfe9d9;
    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

.cultivo:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 35px rgba(23,61,41,.16);
}

.cultivo:active{
    transform:translateY(-1px) scale(.98);
}

.cultivo.activo{
    border-color:var(--lima);
    box-shadow:
        0 0 0 3px rgba(203,220,120,.20),
        0 18px 35px rgba(23,61,41,.18);
}


/* VER TODOS LOS CULTIVOS */

.ver-todos-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:14px;
    padding:13px;
    border-radius:14px;
    cursor:pointer;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:.2px;
    color:var(--verde2);
    background:var(--crema);
    border:1.5px solid transparent;
    transition:border-color .2s ease, transform .2s ease;
}

.ver-todos-toggle::before{
    content:"🌱";
    font-size:13px;
}

.ver-todos-toggle:hover{
    border-color:var(--verde3);
    transform:translateY(-1px);
}

.cultivos-extra-panel{
    margin-top:10px;
}


/* CONSOCIACIONES */

.consoc-presets{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
}

.consoc-preset-chip{
    padding:9px 13px;
    border-radius:20px;
    background:var(--crema);
    border:1.5px solid transparent;
    font-size:10.5px;
    font-weight:700;
    color:var(--verde2);
    cursor:pointer;
    transition:border-color .2s ease, transform .15s ease;
}

.consoc-preset-chip:hover{
    border-color:var(--verde3);
    transform:translateY(-1px);
}

.consoc-selects{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.consoc-campo label{
    display:block;
    margin-bottom:6px;
    font-size:10px;
    font-weight:800;
    color:var(--verde2);
}

.consoc-campo select{
    width:100%;
    padding:12px 12px;
    border-radius:12px;
    border:2px solid var(--borde);
    font-size:12.5px;
    font-family:inherit;
    color:var(--texto);
    background:white;
}

.consoc-slider-wrap{
    margin-top:16px;
}

.consoc-slider-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
    font-size:11px;
    color:var(--gris);
}

.consoc-slider-top strong{
    font-size:13px;
    color:var(--verde);
}

.consoc-slider-wrap input[type="range"]{
    width:100%;
    accent-color:var(--verde2);
}

.consoc-preview{
    margin-top:16px;
    padding:14px;
    border-radius:13px;
    background:white;
    border:1.5px solid var(--borde);
    font-size:11.5px;
    line-height:1.6;
    color:var(--gris);
    transition:border-color .2s ease;
}

.consoc-preview.activo{
    border-color:var(--lima);
    color:var(--texto);
}

.consoc-preview strong{
    color:var(--verde);
}

.consoc-preview.oculto{
    display:none;
}

.consoc-nota{
    margin:12px 0 0;
    font-size:9.5px;
    line-height:1.6;
    color:var(--gris);
}

.cultivo::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to top,
            rgba(9,28,16,.88) 0%,
            rgba(9,28,16,.35) 45%,
            rgba(9,28,16,.05) 75%
        );
    z-index:2;
}

    position:absolute;
    inset:0;
    overflow:hidden;
    background-size:cover;
    background-position:center;

/* TEXTO */

.cultivo-info{
    position:absolute;
    z-index:4;
    left:18px;
    right:18px;
    bottom:16px;
    color:white;
}

.cultivo-info strong{
    display:block;
    font-size:18px;
    font-weight:900;
    letter-spacing:-.5px;
}

.cultivo-info small{
    display:block;
    margin-top:4px;
    color:rgba(255,255,255,.70);
    font-size:8px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
}

.check{
    position:absolute;
    z-index:5;
    top:13px;
    right:13px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--lima);
    color:var(--verde);
    font-size:13px;
    font-weight:900;
    box-shadow:0 7px 15px rgba(0,0,0,.18);
    opacity:0;
    transform:scale(.4);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
}

.cultivo.activo .check{
    opacity:1;
    transform:scale(1);
}


/* =========================================================
   ESTADO DEL FORRAJE
========================================================= */

.estados{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.estado-opcion{
    padding:16px 10px;
    text-align:center;
    border-radius:16px;
    border:2px solid var(--borde);
    background:#fafbf8;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease, transform .2s ease;
}

.estado-opcion:hover{
    transform:translateY(-2px);
}

.estado-opcion:active{
    transform:translateY(0) scale(.97);
}

.estado-opcion .emoji{
    font-size:24px;
    display:block;
    margin-bottom:6px;
}

.estado-opcion strong{
    display:block;
    font-size:10.5px;
    color:var(--verde);
}

.estado-opcion span{
    display:block;
    margin-top:3px;
    font-size:9px;
    color:var(--gris);
    line-height:1.4;
}

.estado-opcion.activo{
    border-color:var(--lima);
    background:#f4f8ec;
}


/* =========================================================
   DESTINO DEL FORRAJE
========================================================= */

.destino{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.destino-opcion{
    padding:15px;
    display:flex;
    align-items:center;
    gap:11px;
    border-radius:16px;
    border:2px solid var(--borde);
    background:#fafbf8;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease, transform .2s ease;
}

.destino-opcion:hover{
    transform:translateY(-2px);
}

.destino-opcion:active{
    transform:translateY(0) scale(.97);
}

.destino-opcion .emoji{
    font-size:22px;
    flex-shrink:0;
}

.destino-opcion strong{
    display:block;
    font-size:10.5px;
    color:var(--verde);
}

.destino-opcion span{
    display:block;
    margin-top:2px;
    font-size:8.5px;
    color:var(--gris);
    line-height:1.4;
}

.destino-opcion.activo{
    border-color:var(--lima);
    background:#f4f8ec;
}


/* =========================
   DATOS
========================= */

.datos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.input-box{
    padding:18px;
    border:1px solid var(--borde);
    border-radius:18px;
    background:#fafbf8;
}

input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:var(--verde);
    font-size:29px;
    font-weight:900;
}

.unidad{
    margin-top:4px;
    color:var(--gris);
    font-size:10px;
}


/* =========================
   BOTON
========================= */

.calcular{
    width:100%;
    margin-top:22px;
    padding:17px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,var(--verde),var(--verde2));
    color:white;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 15px 30px rgba(23,61,41,.20);
    transition:transform .15s ease, filter .2s ease, box-shadow .2s ease;
}

.calcular:hover{
    filter:brightness(1.08);
    transform:translateY(-2px);
    box-shadow:0 18px 34px rgba(23,61,41,.26);
}

.calcular:active{
    transform:translateY(0) scale(.97);
    filter:brightness(.97);
}


/* =========================================================
   MODO ASESOR
========================================================= */

.asesor-link{
    display:block;
    margin-top:16px;
    text-align:center;
    color:#b7bdb5;
    font-size:9px;
    font-weight:700;
    letter-spacing:.4px;
    cursor:pointer;
    text-decoration:underline;
}

.asesor-panel{
    display:none;
    margin-top:12px;
    padding:16px;
    border-radius:14px;
    background:#f4f7f2;
    border:1px dashed #c7d0c1;
}

.asesor-panel.mostrar{
    display:block;
    animation:aparecer .3s ease;
}

.asesor-panel .label{
    margin-bottom:4px;
}

.asesor-panel p{
    margin:0 0 12px;
    color:var(--gris);
    font-size:9.5px;
    line-height:1.6;
}
